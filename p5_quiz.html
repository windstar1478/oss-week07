<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>P5 우선순위 퀴즈</title>
  <style>
    /* 문제 1 */
    p { color: red; }
    .note { color: blue; }
    #star { color: green; }

    /* 문제 2 */
    .tip.big { color: orange; }
    .tip { color: blue; }

    /* 문제 3 */
    .urgent { color: red; }
    .memo { color: gray; }

    /* 문제 4 */
    #panel { color: red; font-size: 20px; }
    .info { color: blue !important; font-size: 12px; }

    /* 문제 5 */
    #hero { color: green; }
  </style>
</head>
<body>
  <p id="star" class="note">문제 1의 문장</p>
  <p class="tip big">문제 2의 문장</p>
  <p class="memo urgent">문제 3의 문장</p>
  <p id="panel" class="info">문제 4의 문장</p>
  <p id="hero" style="color: purple;">문제 5의 문장</p>
</body>
</html>
